<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Teaching Assistant</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        .chat-container { height: calc(100vh - 12rem); }
        .markdown-body p { margin-bottom: 0.5rem; }
        .markdown-body strong { font-weight: 600; color: #2d3748; }
    </style>
</head>
<body class="bg-gray-100 flex flex-col h-screen font-sans">
    <!-- Navbar -->
    <header class="bg-white shadow-sm flex items-center justify-between px-6 py-4">
        <h1 class="text-xl font-bold text-blue-600">AI Teaching Assistant</h1>
        
        <div class="flex items-center gap-2">
            <label class="cursor-pointer bg-blue-50 text-blue-600 px-4 py-2 rounded-lg text-sm font-semibold hover:bg-blue-100 transition">
                <span>Upload Book (PDF)</span>
                <input type="file" id="uploadInput" accept=".pdf" class="hidden" onchange="handleUpload(event)">
            </label>
            <span id="uploadStatus" class="text-sm text-gray-500 hidden">Uploading...</span>
        </div>
    </header>

    <!-- Main Chat Area -->
    <main class="flex-1 max-w-4xl w-full mx-auto p-4 flex flex-col gap-4 overflow-hidden">
        
        <!-- Chat History -->
        <div id="chatHistory" class="chat-container overflow-y-auto bg-white rounded-xl shadow-sm p-6 flex flex-col gap-6">
            <!-- Greeting Message -->
            <div class="flex gap-4">
                <div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center flex-shrink-0 text-xl">🤖</div>
                <div class="flex-1 bg-gray-50 rounded-2xl p-4 text-gray-800">
                    <p>Hello! I am your AI Teaching Assistant. Please upload a book (PDF) to build my knowledge base, and then ask me any questions!</p>
                </div>
            </div>
        </div>

        <!-- Input Box -->
        <div class="bg-white rounded-xl shadow-sm p-3 flex gap-3">
            <input 
                type="text" 
                id="messageInput" 
                placeholder="Ask a question..." 
                class="flex-1 bg-gray-50 border-none rounded-lg px-4 py-2 focus:ring-2 focus:ring-blue-500 outline-none"
                onkeypress="handleKeyPress(event)"
            >
            <button 
                onclick="sendMessage()"
                class="bg-blue-600 text-white px-6 py-2 rounded-lg font-semibold hover:bg-blue-700 transition"
                id="sendBtn"
            >
                Send
            </button>
        </div>
    </main>

    <script src="/static/app.js"></script>
</body>
</html>
